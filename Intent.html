<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在打开…</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: #666; background: #fafafa; padding: 20px; box-sizing: border-box;
  }
  #msg {
    text-align: center; line-height: 1.6; font-size: 16px;
    margin-bottom: 20px; white-space: pre-line;
  }
  #actions {
    display: none; /* 默认隐藏，失败后才显示 */
    flex-direction: column; gap: 12px; width: 100%; max-width: 320px;
  }
  button {
    padding: 16px; font-size: 16px; border: none; border-radius: 12px;
    cursor: pointer; font-weight: 600; touch-action: manipulation;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); opacity: 0.9; }
  #retryBtn { background: #1677ff; color: #fff; box-shadow: 0 4px 12px rgba(22,119,255,0.3); }
  #downloadBtn { background: #e8f3ff; color: #1677ff; box-shadow: 0 4px 12px rgba(22,119,255,0.1); }
</style>
</head>
<body>
<div id="msg">正在打开应用…</div>

<div id="actions">
  <button id="retryBtn">重试打开</button>
  <button id="downloadBtn">下载 Via 浏览器</button>
</div>

<script>
(function () {
  var msg = document.getElementById('msg');
  var actions = document.getElementById('actions');
  var retryBtn = document.getElementById('retryBtn');
  var downloadBtn = document.getElementById('downloadBtn');

  var opened = false; // 是否成功唤起
  var checkTimer = null; // 检测定时器

  // ================= 1. 解析参数 =================
  var raw = window.location.search.substring(1);
  if (!raw) { showError('缺少参数'); return; }

  var value = raw.replace(/^=/, '');
  var slash = value.indexOf('/');
  if (slash < 0) { showError('参数格式错误，应为 包名/活动全路径'); return; }

  var pkg = value.substring(0, slash);
  var activity = value.substring(slash + 1);
  var component = pkg + '/' + activity;

  // ================= 2. 拼接 intent:// =================
  var intentUrl =
    'intent://open/#Intent;' +
    'action=android.intent.action.MAIN;' +
    'category=android.intent.category.LAUNCHER;' +
    'category=android.intent.category.BROWSABLE;' +
    'package=' + pkg + ';' +
    'component=' + component + ';' +
    'end';

  // ================= 3. 跳转触发函数 =================
  function launchApp() {
    msg.textContent = '正在打开应用…';
    actions.style.display = 'none';

    // 方式 A：iframe 触发
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = intentUrl;
    document.body.appendChild(iframe);

    // 方式 B：延迟补刀
    setTimeout(function () {
      try { window.location.href = intentUrl; } catch (e) {}
    }, 100);

    // 启动失败检测
    startCheck();
  }

  // ================= 4. 检测是否成功唤起 =================
  function markOpened() {
    if (opened) return;
    opened = true;
    msg.textContent = '已打开';
    actions.style.display = 'none';
    if (checkTimer) clearTimeout(checkTimer);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) markOpened();
  });
  window.addEventListener('pagehide', markOpened);

  // ================= 5. 失败检测（2.5秒无响应则显示按钮） =================
  function startCheck() {
    if (checkTimer) clearTimeout(checkTimer);
    checkTimer = setTimeout(function () {
      if (!document.hidden && !opened) {
        msg.textContent = '未能直接打开应用。\n\n' +
          '说明：部分浏览器（如 Chrome、Edge 等）出于安全策略，\n' +
          '会拦截网页直接启动其他 App 的特定页面。\n\n' +
          'Via 浏览器支持此功能。您可以点击下方按钮重试，\n' +
          '或下载 Via 浏览器后重新访问本链接。';
        actions.style.display = 'flex';
      }
    }, 2500);
  }

  // ================= 6. 按钮事件绑定 =================
  retryBtn.addEventListener('click', function () {
    launched = false;
    launchApp(); // 再次触发
  });

  downloadBtn.addEventListener('click', function () {
    window.location.href = 'https://www.viayoo.com';
  });

  // ================= 7. 初始启动 =================
  function showError(text) {
    msg.textContent = text;
    actions.style.display = 'none';
  }

  // 首次自动尝试
  launchApp();

})();
</script>
</body>
</html>
